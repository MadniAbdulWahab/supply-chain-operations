[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-operations-lakehouse"
version = "0.1.0"
description = "A deterministic supply-chain analytics lakehouse using Python, DuckDB, SQL, and Parquet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
sco-lakehouse = "supply_chain_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fabric/notebooks/import"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells run after the parameter cell, use Fabric's global `spark`, and must also
# run on the Python 3.10 local Spark image.
"fabric/notebooks/*.py" = ["E402", "F821", "UP017"]
